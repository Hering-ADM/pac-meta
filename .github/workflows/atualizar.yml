name: Atualizar dados e publicar

on:
  schedule:
    - cron: '17 * * * *'   # a cada hora, no minuto 17 (UTC)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['site/**', 'scripts/**', 'data/archetypes.json', '.github/workflows/**']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: atualizar
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Coletar resultados do MTGO
        working-directory: scripts
        run: python collect.py
      - name: Imagens e preços do Scryfall (uma vez por dia)
        continue-on-error: true
        working-directory: scripts
        run: python prices.py
      - name: Cotação do dólar
        continue-on-error: true
        working-directory: scripts
        run: python fx.py
      - name: Bhell (planilha da Pac Deck)
        continue-on-error: true
        working-directory: scripts
        run: python bhell.py
      - name: Montar os dados do site
        working-directory: scripts
        run: python build.py
      - name: Guardar os dados coletados
        # se falhar (outro envio ao mesmo tempo), o site é publicado mesmo assim
        continue-on-error: true
        run: |
          git config user.name "pac-meta-bot"
          git config user.email "pac-meta-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Dados: atualização automática $(date -u +'%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3 4; do
            git push && exit 0
            git pull --rebase -X theirs origin main || { git rebase --abort; git pull --no-rebase -X theirs --no-edit origin main; }
            sleep $((i * 5))
          done
          exit 1
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
